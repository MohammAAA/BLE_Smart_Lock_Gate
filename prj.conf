# prj.conf — 5 diagnostic LEDs + USB CDC ACM, NO LOG (deadlock workaround)
#
# We disable LOG entirely because LOG_MODE_IMMEDIATE + CDC ACM console
# causes a deadlock during USB enumeration (the log backend blocks the
# USB interrupt handler). Once USB is confirmed working, we'll add LOG
# back in deferred mode (not immediate mode).

CONFIG_PRINTK=y
CONFIG_GPIO=y

# New USB device stack (Zephyr 4.x)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# Disable ALL USB-related logging to prevent the deadlock
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_OFF=y

# Console routing (printk goes to CDC ACM)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Explicitly disable LOG (the key fix)
CONFIG_LOG=n