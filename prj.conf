# Zephyr 4.4 (SDK v1.0.1)
# prj.conf: 5 diagnostic LEDs + USB CDC ACM, LOG, BLE, Thread monitoring
#
# What's included:
#   - GPIO and PRINTK enabled
#   - USB CDC ACM enabled
#   - Serial/UART enabled
#   - LOG enabled in DEFERRED mode
#   - BLE stack enabled
#   - Thread introspection (for stack monitor - development purposes)


# === Kernel ===
CONFIG_MULTITHREADING=y
# Stack size of the system workqueue thread
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
# Stack size of the main thread
CONFIG_MAIN_STACK_SIZE=2048
# 1 kHz tick for fine k_sleep granularity (default was 100Hz)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000


# === Logging ===
CONFIG_LOG=y
# Fixes the LOG - CDC ACM deadlock at initialization
CONFIG_LOG_MODE_DEFERRED=y

# Level policy (Phase 3 L3-E: "quiet world, loud pins" -- allowlist).
# Two knobs, one scalpel:
#   - CONFIG_LOG_DEFAULT_LEVEL: the level for every module that did NOT
#     name its own level at LOG_MODULE_REGISTER() -- that includes the
#     whole Zephyr tree (BT host internals, drivers, USB, workqueue
#     plumbing). Keep it at 3 forever. If we set (DEFAULT=4)
#     we then raise EVERY unpinned module in the system to DBG:
#     peripheral flood + deferred-pool drops.
#   - CONFIG_LOG_MAX_LEVEL: the global compile-time CEILING. A module's
#     effective level is min(its pin, MAX). MAX defaults to DEFAULT_LEVEL,
#     so with DEFAULT=3 an explicit MAX=4 is REQUIRED to let the DBG
#     pins below actually reach DBG -- without it they are silently
#     clamped to INF (no error, no warning, just missing lines).
#   - Per-module pins at the registration site (the scalpel):
#       proximity.c -> LOG_LEVEL_DBG  (telemetry: kalman:/trend:/tick:)
#       scan.c      -> LOG_LEVEL_INF  (only DBG site = per-adv firehose)
#       main.c      -> LOG_LEVEL_INF
#     A pin ignores DEFAULT and can never exceed MAX.
# The Blocklist thinking (raise the world, quiet the noisy) is fragile: every
# new subsystem can leak. Our new Allowlist thinking: only named modules can be
# loud. Volume with these pins: ~4-5 lines/s at 1 Hz adv + 100% duty.
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=3
# Absorb boot-time logs
CONFIG_LOG_BUFFER_SIZE=8192
# safeguard to make sure the USB enumerates first
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=2000
# route logs to CDC ACM
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y 

# === USB (CDC ACM console) ===
# Enable the new USB stack (Zephyr 4.x)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
# Console routing (printk goes to CDC ACM)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
# USB logs at WRN level (we want to see USB problems, but not debug spam)
CONFIG_USBD_LOG_LEVEL_WRN=y

# === Hardware ===
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# === FPU (Phase 3 L2: Kalman filter float math) ==========================
# nRF52840's Cortex-M4F has a single-precision FPU (FPv4-SP, s0-s31).
# CONFIG_FPU=y switches the whole build to the hard-float ABI: float math
# compiles to VADD/VMUL/VDIV FPU instructions instead of __aeabi_* software
# helper calls.
#
# Float discipline for this project (see Phase 3 L2 lesson):
#   - float only, NEVER double: the M4F FPU has no double hardware, so
#     every double operation becomes a slow libgcc software call
#   - every float constant carries the f suffix (2.0f, not 2.0): a bare
#     double constant promotes the whole runtime expression to double
#   - FP math runs ONLY on the system workqueue thread (kalman_update via
#     proximity_on_match + the proximity tick). Exactly one FP thread ->
#     CONFIG_FP_SHARING stays OFF (FPU registers are not saved across
#     context switches; a second FP thread would silently corrupt them).
#     Revisit if a second thread ever executes float code.
#   - no FP in ISRs: unsupported on ARMv7-M in Zephyr. Both our FP paths
#     run in workqueue (thread) context.
CONFIG_FPU=y

# Optional, debugging only: lets LOG/printk print %f directly. Pulls in
# substantial code; production code uses the fmt_float2() fixed-point
# formatter in proximity.c instead.
#CONFIG_CBPRINTF_FP_SUPPORT=y

# === BLE  ===
# We will enable all BLE roles now so we don't have to rebuild later:
#   - OBSERVER:   used for scanning (default state, listens to mobiles advertisments)
#   - CENTRAL:    used for auth (initiate connection to phone)
#   - PERIPHERAL: used for pairing mode (advertise, accept connection from phone)
#   - SMP:        security manager (used for pairing, encryption)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
# security manager (later)
CONFIG_BT_SMP=y
# for pairing service (later)
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_DEVICE_NAME="smart-lock-gate"
# verbose BLE logs during development (will be off in production)
#CONFIG_BT_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_INF=y

# === Thread introspection ===
# CONFIG_THREAD_STACK_INFO: enables k_thread_stack_space_get() which returns
# the high-water mark of free stack for a given thread.
CONFIG_THREAD_STACK_INFO=y
# CONFIG_INIT_STACKS: Initializes the stack with a specific memory pattern (i.e.: 0xAA)
# We need this initialization pattern as the k_thread_stack_space_get() calculates
# the unused stack space by scanning for this untouched init memory pattern
CONFIG_INIT_STACKS=y
# CONFIG_THREAD_MONITOR: maintains a runtime list of all threads (used by
# shell "kernel threads" command). Small memory cost (~32 bytes/thread).
# We enable it for development - useful for debugging stack issues.
CONFIG_THREAD_MONITOR=y
# CONFIG_THREAD_NAME: lets us give threads human-readable names. The BT
# stack already uses this (BT RX, BT TX, etc.). Helps when reading the
# "kernel threads" output.
CONFIG_THREAD_NAME=y
